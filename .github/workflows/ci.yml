name: CI

on:
  push:
    branches: [main]
  pull_request:

# İş akışı yalnızca kodu okur; GITHUB_TOKEN'a yazma yetkisi verilmez
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Build yalnızca derleme yapar; API route'ları çalıştırılmaz. Gerçek anahtar gerekmez.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
      SUPABASE_SECRET_KEY: ci-placeholder-secret-key
      AUTH_MODE: production
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright · mobil PWA)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # verify job'uyla aynı yer tutucular. Tek fark: Supabase URL'si e2e/support/fake-supabase.mjs'e
      # işaret eder (build'e gömülür; middleware oturum doğrulamasını bu yerel sahte sunucuya yapar).
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54329
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
      SUPABASE_SECRET_KEY: ci-placeholder-secret-key
      AUTH_MODE: production
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npx next build --webpack

      - name: E2E
        run: npm run test:e2e
        env:
          # Build bir önceki adımda yapıldı; webServer yalnızca `next start` çalıştırır
          E2E_SKIP_BUILD: 1

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
